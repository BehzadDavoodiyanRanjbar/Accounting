function dash(){$('#v').innerHTML=fyWarnHtml()+filt('d')+'<div id="dr"></div>';runDash()}
function kpis(k){return'<div class="kp">'+k.map(function(x){return'<div><span>'+x[0]+'</span><b class="num">'+fmt(x[1])+'</b></div>'}).join('')+'</div>'}

 return'<div class="card"><h4 style="margin:0 0 8px">'+title+'</h4><div class="fw" style="overflow-x:auto"><table class="rt"><thead><tr><th>'+first+'</th><th class="n tn">فاکتور</th><th class="n">مبلغ</th><th class="n">تخفیف</th><th class="n">مالیات</th><th class="n">قابل پرداخت</th></tr></thead><tbody>'+(rows.length?rows.map(function(x){return'<tr><td class="nm">'+e(x.name)+'</td><td class="n tn">'+x.count+'</td><td class="n">'+fmt(x.gross)+'</td><td class="n">'+fmt(x.disc)+'</td><td class="n">'+fmt(x.vat)+'</td><td class="n">'+fmt(x.total)+'</td></tr>'}).join(''):'<tr><td colspan="6" style="text-align:right;color:var(--m)">داده‌ای نیست.</td></tr>')+'</tbody>'+(rows.length>1?'<tfoot><tr><td>جمع</td><td class="n tn">—</td><td class="n">'+fmt(sum.gross)+'</td><td class="n">'+fmt(sum.disc)+'</td><td class="n">'+fmt(sum.vat)+'</td><td class="n">'+fmt(sum.total)+'</td></tr></tfoot>':'')+'</table></div></div>'}

 h+='<div class="dh"><h3>جدول خریداران و فروشندگان</h3><small>راست: خریداران (فروش) · چپ: فروشندگان (خرید)</small></div><div class="dd">'+rtab('خریداران (فروش به مشتریان)',S.byCustomer||[],'خریدار')+rtab('فروشندگان (خرید از تأمین‌کنندگان)',r.bySupplier,'فروشنده')+'</div>';
 h+='<div class="dh"><h3>نمودارهای خرید</h3></div><div class="bg">'+bars('خرید به تفکیک ماه',r.byMonth,'net',24)+bars('خرید به تفکیک فروشنده',r.bySupplier,'net')+bars('خرید به تفکیک گروه کالا',r.byGroup,'net')+bars('خرید به تفکیک گروه فرعی',r.bySub,'net')+bars('بیشترین کالا از نظر مبلغ',r.byProduct,'net')+bars('بیشترین کالا از نظر تعداد',r.byProduct.slice().sort(function(a,b){return b.qty-a.qty}),'qty')+'</div>';
 h+='<div class="dh"><h3>نمودارهای فروش</h3></div><div class="bg">'+bars('فروش به تفکیک ماه',S.byMonth,'net',24,'g')+bars('فروش به تفکیک خریدار',S.byCustomer,'total',10,'g')+bars('فروش به تفکیک گروه کالا/خدمت',S.byGroup,'net',10,'g')+bars('فروش به تفکیک گروه فرعی',S.bySub,'net',10,'g')+bars('پرفروش‌ترین کالا/خدمت از نظر مبلغ',S.byProduct,'net',10,'g')+bars('پرفروش‌ترین کالا/خدمت از نظر تعداد',(S.byProduct||[]).slice().sort(function(a,b){return b.qty-a.qty}),'qty',10,'g')+'</div>';

 +'<div class="card"><h3 style="margin-top:0">هوش مصنوعی برای ثبت از اسکن</h3><p>وضعیت کلید Anthropic API برای این شرکت: <b>'+(D.ownKey?'ثبت شده':(sh?'استفاده از کلید مشترک مدیر سیستم':'ثبت نشده'))+'</b>. کلید بعد از ثبت قابل نمایش نیست.</p><div class="row"><div class="f"><label>کلید API (sk-ant-...؛ خالی = حذف کلید)</label><input id="s_k" type="password" class="num" autocomplete="off"></div><button class="bt" onclick="saveKey()">ذخیره کلید</button></div></div>':'<div class="card"><p>هنوز شرکتی تعریف نشده است؛ از «شرکت‌ها/مشتریان» یکی بسازید. تنظیمات سیستم در پایین است.</p></div>';
 if(adm)h+='<div class="card" style="border:2px solid var(--b)"><h3 style="margin-top:0">تنظیمات سیستم (فقط مدیر سیستم)</h3><div class="row"><div class="f"><label>نرخ پیش‌فرض مالیات برای شرکت‌هایی که نرخ جدا ندارند (٪)</label><input id="g_v" class="num" value="'+e(RAW.vat)+'"></div><button class="bt" onclick="saveGlobalVat()">ذخیره</button></div><div class="row" style="margin-top:8px"><div class="f"><label>محیط پیش‌فرض مودیان برای شرکت‌هایی که محیط جدا ندارند</label><select id="g_env"><option value="sandbox">آزمایشی (Sandbox)</option><option value="prod">واقعی (Production)</option></select></div><button class="bt" onclick="saveGlobalEnv()">ذخیره</button></div><div class="row" style="margin-top:8px"><div class="f"><label>کلید API مشترک همه شرکت‌ها (خالی = حذف)</label><input id="g_k" type="password" class="num" autocomplete="off"></div><button class="bt" onclick="saveGlobalKey()">ذخیره کلید مشترک</button></div><p><label><input type="checkbox" id="g_sh" '+(RAW.aiShared?'checked':'')+' onchange="saveShared()"> شرکت‌هایی که کلید خودشان را ندارند از کلید مشترک استفاده کنند</label></p><hr><h4>نسخه پشتیبان کامل سیستم</h4><p>شامل همه شرکت‌ها، کاربران و کلیدها. این فایل را فقط نزد خودتان نگه دارید.</p><button class="bt" onclick="bk()">تهیه و دانلود نسخه پشتیبان کامل</button></div>'

  var cur=a[0].contracts.filter(function(c){return c.ContractID===CS6.ctr})[0]||{};
  var h='<div class="card"><div class="row">'+bkFld('قرارداد',csSel('c6c',csCtOpts(),CS6.ctr,undefined,'min-width:260px'))+bkb('نمایش','CS6.ctr=$(\'#c6c\').value;cs6BillView()','')+'</div>'
   +(cur.ContractID?'<p>مبلغ پایه: <b class="num">'+fmt(cur.BaseAmount)+'</b> | جمع الحاقیه‌ها: <b class="num">'+fmt(cur.amend)+'</b> | مبلغ فعلی: <b class="num">'+fmt(cur.Effective)+'</b></p>':'')+'<p class="hint">الحاقیه، مبلغ قرارداد را از ماه تاریخ اثر کم یا زیاد می‌کند (اثر آن به‌صورت جبران تجمعی در درآمد همان ماه می‌آید). صورت‌وضعیت کارفرما در صدور بعدی به‌صورت سند «حساب‌های دریافتنی ← دارایی قرارداد (و ارزش افزوده‌ی فروش)» صادر می‌شود تا درآمد دوبار ثبت نشود؛ پس برای همان مبلغ فاکتور فروش جداگانه نزنید. ارزش افزوده را خودتان وارد می‌کنید. هر دو [نیازمند تأیید حسابدار].</p></div>';
  h+='<div class="card tw"><div class="row"><b style="flex:1">الحاقیه‌های قرارداد</b>'+(CS6.ctr?bkb('+ الحاقیه','cs6AmForm(\'\')',''):'')+'</div><table><thead><tr><th>تاریخ اثر</th><th>تغییر مبلغ (ریال)</th><th>توضیحات</th><th></th></tr></thead><tbody>'+(a[0].rows.length?a[0].rows.map(function(x,i){return'<tr><td class="num">'+e(x.DateJalali)+'</td><td class="num" style="color:'+(x.Delta<0?'var(--r)':'inherit')+'">'+fmt(x.Delta)+'</td><td>'+e(x.Notes)+'</td><td>'+bkb('ویرایش','cs6AmForm('+i+')','')+bkb('حذف','cs6AmDel('+i+')','d')+'</td></tr>'}).join(''):'<tr><td colspan="4" class="hint">الحاقیه‌ای ثبت نشده است.</td></tr>')+'</tbody></table></div>';
  h+='<div class="card tw"><div class="row"><b style="flex:1">صورت‌وضعیت‌های صادرشده برای کارفرما</b>'+(CS6.ctr?bkb('+ صورت‌وضعیت','cs6BlForm(\'\')',''):'')+'</div><table><thead><tr><th>شماره</th><th>تاریخ</th><th>مبلغ (بدون ارزش افزوده)</th><th>ارزش افزوده</th><th>وضعیت</th><th>توضیحات</th><th></th></tr></thead><tbody>'+(a[1].rows.length?a[1].rows.map(function(x,i){return'<tr><td class="num">'+e(x.No)+'</td><td class="num">'+e(x.DateJalali)+'</td><td class="num">'+fmt(x.Amount)+'</td><td class="num">'+fmt(x.Vat)+'</td><td>'+(x.Posted?'در سند صادر شده':'صادرنشده')+'</td><td>'+e(x.Notes)+'</td><td>'+(x.Posted?'':bkb('ویرایش','cs6BlForm('+i+')','')+bkb('حذف','cs6BlDel('+i+')','d'))+'</td></tr>'}).join(''):'<tr><td colspan="7" class="hint">صورت‌وضعیتی ثبت نشده است.</td></tr>')+'</tbody><tfoot><tr><td colspan="2">جمع</td><td class="num">'+fmt(a[1].totals.a)+'</td><td class="num">'+fmt(a[1].totals.v)+'</td><td colspan="3"></td></tr></tfoot></table></div>';
  $('#c6b').innerHTML=h}).catch(cs6Err)}
function cs6AmForm(i){var o=i===''?{}:CS6.AM.rows[i];modal('<h3>'+(i===''?'الحاقیه‌ی جدید':'ویرایش الحاقیه')+'</h3><div class="row">'+bkFld('تاریخ اثر *',bkI('am_d',o.DateJalali||xlsHead(),'class="num" style="max-width:120px"'))+bkFld('تغییر مبلغ (ریال؛ برای کاهش با منفی) *',bkI('am_a',o.Delta||'','class="num" style="max-width:200px"'))+bkFld('توضیحات',bkI('am_n',o.Notes||'','style="min-width:240px"'))+'</div><div class="row">'+bkb('ذخیره','cs6AmSave(\''+(i===''?'':o.AMID)+'\')','p')+bkb('انصراف','closeM()','')+'</div>')}
function cs6AmSave(id){call('csSave',{company:CO,kind:'amend',obj:{AMID:id,ContractID:CS6.ctr,DateJalali:$('#am_d').value,Delta:$('#am_a').value,Notes:$('#am_n').value}}).then(function(){closeM();toast('ذخیره شد.');cs6BillView()}).catch(fail)}
function cs6AmDel(i){var x=CS6.AM.rows[i];if(!confirm('این الحاقیه حذف شود؟'))return;call('csDelete',{company:CO,kind:'amend',id:x.AMID}).then(function(){toast('حذف شد.');cs6BillView()}).catch(fail)}
function cs6BlForm(i){var o=i===''?{}:CS6.BL.rows[i];modal('<h3>'+(i===''?'صورت‌وضعیت جدید':'ویرایش صورت‌وضعیت')+'</h3><div class="row">'+bkFld('شماره (خالی = خودکار)',bkI('bl_no',o.No||'','class="num" style="max-width:90px"'))+bkFld('تاریخ *',bkI('bl_d',o.DateJalali||xlsHead(),'class="num" style="max-width:120px"'))+bkFld('مبلغ بدون ارزش افزوده *',bkI('bl_a',o.Amount||'','class="num" style="max-width:180px"'))+bkFld('ارزش افزوده (مبلغ؛ خالی = ندارد)',bkI('bl_v',o.Vat||'','class="num" style="max-width:160px"'))+bkFld('توضیحات',bkI('bl_n',o.Notes||'','style="min-width:220px"'))+'</div><div class="row">'+bkb('ذخیره','cs6BlSave(\''+(i===''?'':o.BLID)+'\')','p')+bkb('انصراف','closeM()','')+'</div>')}
function cs6BlSave(id){call('csSave',{company:CO,kind:'bill',obj:{BLID:id,ContractID:CS6.ctr,No:$('#bl_no').value,DateJalali:$('#bl_d').value,Amount:$('#bl_a').value,Vat:$('#bl_v').value,Notes:$('#bl_n').value}}).then(function(){closeM();toast('ذخیره شد.');cs6BillView()}).catch(fail)}
function cs6BlDel(i){var x=CS6.BL.rows[i];if(!confirm('این صورت‌وضعیت حذف شود؟'))return;call('csDelete',{company:CO,kind:'bill',id:x.BLID}).then(function(){toast('حذف شد.');cs6BillView()}).catch(fail)}
/* ---- تب ۲: گزارش جامع ---- */
var CS6C=[{k:'ct',t:'قرارداد',w:30},{k:'pg',t:'پیشرفت (٪)'},{k:'Amount',t:'مبلغ قرارداد',n:1},{k:'revCum',t:'درآمد تجمعی',n:1},{k:'costCum',t:'بهای خدمات تجمعی',n:1},{k:'gpCum',t:'سود ناخالص تجمعی',n:1},{k:'wipBalance',t:'هزینه‌ی در جریان (نصب‌نشده)',n:1},{k:'assetBalance',t:'دارایی کسب/ایفا',n:1},{k:'provision',t:'ذخیره‌ی زیان',n:1},{k:'pRev',t:'درآمد صادرشده',n:1},{k:'pCost',t:'بهای صادرشده',n:1},{k:'pProv',t:'ذخیره‌ی صادرشده',n:1},{k:'billed',t:'صورت‌وضعیت کارفرما',n:1},{k:'unbilled',t:'دارایی قرارداد (درآمد مطالبه‌نشده)',n:1},{k:'contractLiab',t:'بدهی قرارداد (پیش از درآمد)',n:1},{k:'pend',t:'صادرنشده (درآمد / بها / ذخیره)'}];
function cs6RepRows(r){return r.rows.map(function(x){return{ct:x.No+' - '+x.Title,pg:x.computable?(Math.round(x.progressPct*100)/100)+'٪':'نیاز به برآورد',Amount:x.Amount,revCum:x.revCum,costCum:x.costCum,gpCum:x.gpCum,wipBalance:x.wipBalance,assetBalance:x.assetBalance,provision:x.provision,pRev:x.posted.rev,pCost:x.posted.cost,pProv:x.posted.prov,billed:x.billed,unbilled:x.unbilled,contractLiab:x.contractLiab,pend:x.computable?(x.pending.rev+' / '+x.pending.cost+' / '+x.pending.prov):'—',_st:x.loss>0?'background:rgba(200,0,0,.06)':''}})}
function cs6RepFoot(r){var T=r.totals;return{ct:'جمع',Amount:T.amount,revCum:T.revCum,costCum:T.costCum,gpCum:T.gpCum,wipBalance:T.wip,assetBalance:T.asset,provision:T.provision,pRev:T.pRev,pCost:T.pCost,pProv:T.pProv,billed:T.billed,unbilled:T.unbilled,contractLiab:T.liab}}
function cs6RepView(){call('csRep6',{company:CO,period:cs6Per()}).then(function(r){CS6.rep=r;var rows=cs6RepRows(r),foot=cs6RepFoot(r),h='<div class="card"><div class="row"><b style="flex:1">گزارش جامع بهای تمام‌شده خدمات — ماه '+e(r.period)+'</b>'+bkb('Excel','cs6RepXls()','')+bkb('چاپ','cs6RepPrint()','')+'</div>'
  +'<p>قراردادها: <b>'+r.counts.contracts+'</b> | بدون پیشرفت قابل‌محاسبه: <b>'+r.counts.incomplete+'</b> | زیان‌ده: <b>'+r.counts.lossContracts+'</b></p><div class="tw">'+cs6Table(CS6C,rows,foot)+'</div></div>';
  h+='<div class="card"><b>کنترل‌ها</b><ul style="margin:6px 0 0">'+r.checks.map(function(c){return'<li style="color:'+(c.ok?'inherit':(c.info?'var(--m)':'var(--r)'))+'">'+(c.ok?'✔ ':'✖ ')+e(c.text)+'</li>'}).join('')+'</ul></div>';
  var oh=r.overhead;if(oh&&!oh.error){h+='<div class="card tw"><b>سربار تسهیم‌شده، کم/بیش‌جذب و ظرفیت بلااستفاده (همین ماه)</b><p class="hint">سربار واقعی در حساب‌های طبیعی هزینه مانده و سربار جذب‌شده با حساب «هزینه‌های جذب‌شده» (بستانکار) خارج می‌شود؛ مانده‌ی خالص (کم‌جذب = بدهکار، بیش‌جذب = بستانکار) در سود و زیان دوره می‌ماند و سند جدا ندارد. سیاست سال: '+e(oh.policy==='prorate'?'تعدیل در پایان سال':'هزینه/درآمد دوره')+'.</p>'
   +(oh.pools&&oh.pools.length?cs6Table([{k:'name',t:'مرکز سربار'},{k:'Absorbed',t:'جذب‌شده',n:1},{k:'Actual',t:'واقعی',n:1},{k:'Variance',t:'کم(+)/بیش(−) جذب',n:1},{k:'VolumeVar',t:'انحراف حجم',n:1},{k:'SpendingVar',t:'انحراف مصرف',n:1},{k:'Unused',t:'ظرفیت بلااستفاده',n:1}],oh.pools.map(function(p){return Object.assign({name:p.Code+' - '+p.Name},p)}),{name:'جمع',Absorbed:oh.totals.absorbed,Actual:oh.totals.actual,Variance:oh.totals.variance,Unused:oh.totals.unused}):'<p class="hint">مرکز سربار تعریف نشده است.</p>')+'</div>'}
  if(r.periodCosts.length)h+='<div class="card tw"><b>هزینه‌های دوره‌ای (خارج از بهای قرارداد)</b>'+cs6Table([{k:'Code',t:'کد'},{k:'Name',t:'عنصر'},{k:'period',t:'همین ماه',n:1},{k:'cum',t:'تجمعی',n:1}],r.periodCosts)+'</div>';
  h+=cs6Warn(r.warnings)+'<div class="card"><b>صدورهای اخیر</b>'+cs6Runs(r.runs)+'<p class="hint">'+e(r.disclaimer)+'</p></div>';
  $('#c6b').innerHTML=h}).catch(cs6Err)}
function cs6RepXls(){var r=CS6.rep;if(!r)return;cs6Xls('cost-report','گزارش جامع بهای خدمات','ماه '+r.period,CS6C,cs6RepRows(r),cs6RepFoot(r),['گزارش کمکی؛ نیازمند تأیید حسابدار/حسابرس رسمی.'].concat(r.warnings.slice(0,20)))}
function cs6RepPrint(){var r=CS6.rep;if(!r)return;cs6Print('گزارش جامع بهای تمام‌شده خدمات','ماه '+r.period,CS6C,cs6RepRows(r),cs6RepFoot(r),[r.disclaimer].concat(r.warnings.slice(0,20)),true)}
/* ---- تب ۳: فهرست موارد نیازمند تأیید ---- */
var CS6V=[{k:'type',t:'نوع'},{k:'code',t:'کد/کلید'},{k:'title',t:'موضوع',w:60},{k:'value',t:'مقدار فعلی'},{k:'source',t:'منبع / مبنا',w:36},{k:'sign',t:'تأییدکننده / تاریخ'}];
function cs6VerView(){call('csVerify6',{company:CO}).then(function(r){CS6.ver=r;
 var h='<div class="card tw"><div class="row"><b style="flex:1">فهرست جامع موارد «نیازمند تأیید»</b>'+bkb('Excel','cs6VerXls()','')+bkb('چاپ','cs6VerPrint()','')+'</div><p class="hint">'+e(r.disclaimer)+'</p><p>قواعد: <b>'+r.counts.rules+'</b> | عناصر هزینه: <b>'+r.counts.elems+'</b> | مبناهای تسهیم: <b>'+r.counts.bases+'</b> | مبناهای صدور سند: <b>'+r.counts.notes+'</b>. تغییر قواعد در «تنظیمات بهای خدمات».</p>'+cs6Table(CS6V,r.items.map(function(i){return Object.assign({sign:''},i)}))+'</div>';
 $('#c6b').innerHTML=h}).catch(cs6Err)}
function cs6VerXls(){var r=CS6.ver;if(!r)return;cs6Xls('needs-confirmation','موارد نیازمند تأیید','',CS6V,r.items.map(function(i){return Object.assign({sign:''},i)}),null,[r.disclaimer])}
function cs6VerPrint(){var r=CS6.ver;if(!r)return;cs6Print('موارد نیازمند تأیید — بهای تمام‌شده خدمات','',CS6V,r.items.map(function(i){return Object.assign({sign:''},i)}),null,[r.disclaimer],true)}
/* ===== CS6:END ===== */
</script>
</body></html>
